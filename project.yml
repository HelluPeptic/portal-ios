# XcodeGen spec - the Xcode project is generated from this in CI
# (`xcodegen generate`), so there's no .xcodeproj to keep in sync by hand.
name: Portal
options:
  bundleIdPrefix: org.hellupeptic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    from: 4.8.4

targets:
  Portal:
    type: application
    platform: iOS
    sources:
      - path: Portal
        excludes:
          - Info.plist
    dependencies:
      - package: GoogleCast
        product: GoogleCastDynamic
    scheme: {}
    info:
      path: Portal/Info.plist
      properties:
        CFBundleDisplayName: Peptic's Workshop
        CFBundleName: Peptic's Workshop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Keeps sound going for picture-in-picture when leaving the app.
        UIBackgroundModes:
          - audio
        # Google Cast discovery (Default Media Receiver, app ID CC1AD845).
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        NSLocalNetworkUsageDescription: Peptic's Workshop looks for Chromecasts and Google TVs on your Wi-Fi so you can play videos on them.
        # The site's file pickers can offer the camera; without these the app would crash when that's picked.
        NSCameraUsageDescription: Lets you take a photo or video to upload.
        NSMicrophoneUsageDescription: Lets you record a video with sound to upload.
        NSPhotoLibraryUsageDescription: Lets you pick photos and videos to upload.
        NSPhotoLibraryAddUsageDescription: Lets you save photos and videos you download.
        LSApplicationQueriesSchemes:
          - sidestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hellupeptic.portal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
