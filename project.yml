# XcodeGen spec - the Xcode project is generated from this in CI
# (`xcodegen generate`), so there's no .xcodeproj to keep in sync by hand.
name: Portal
options:
  bundleIdPrefix: org.hellupeptic
  # 16.2 for the live panel on the lock screen (Live Activities).
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true

packages:
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    from: 4.8.4

targets:
  Portal:
    type: application
    platform: iOS
    sources:
      - path: Portal
        excludes:
          - Info.plist
          - Portal.entitlements
      - path: Shared
    dependencies:
      - package: GoogleCast
        product: GoogleCastDynamic
      # The home screen widget. SideStore asks whether to keep it when
      # installing (it needs an App ID of its own unless signed with the
      # app's), so the app works the same without it.
      - target: PortalWidget
      # "Peptic's Workshop" in the share menu, saving to The Cache. Like
      # the widget, SideStore asks about it when installing.
      - target: PortalShare
    scheme: {}
    info:
      path: Portal/Info.plist
      properties:
        CFBundleDisplayName: Peptic's Workshop
        CFBundleName: Peptic's Workshop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Keeps sound going for picture-in-picture when leaving the app.
        UIBackgroundModes:
          - audio
        # Google Cast discovery (Default Media Receiver, app ID CC1AD845).
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        NSLocalNetworkUsageDescription: Peptic's Workshop looks for Chromecasts and Google TVs on your Wi-Fi so you can play videos on them.
        # The site's file pickers can offer the camera; without these the app would crash when that's picked.
        NSCameraUsageDescription: Lets you take a photo or video to upload.
        NSMicrophoneUsageDescription: Lets you record a video with sound to upload.
        NSPhotoLibraryUsageDescription: Lets you pick photos and videos to upload.
        NSPhotoLibraryAddUsageDescription: Lets you save photos and videos you download.
        LSApplicationQueriesSchemes:
          - sidestore
        # The live panel on the lock screen (LiveStats).
        NSSupportsLiveActivities: true
        # pepticworkshop://<page> opens that page of the site.
        CFBundleURLTypes:
          - CFBundleURLName: org.hellupeptic.portal
            CFBundleURLSchemes:
              - pepticworkshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hellupeptic.portal
        CODE_SIGN_ENTITLEMENTS: Portal/Portal.entitlements
        # Shared code that only the app runs (Shared/ControlIntents.swift).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PORTAL_APP"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO

  # The Pi's numbers on the home screen and lock screen (see ServerWidget).
  # It shares the app group with the app, for the token the app hands it.
  PortalWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PortalWidget
        excludes:
          - Info.plist
          - PortalWidget.entitlements
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: PortalWidget/Info.plist
      properties:
        CFBundleDisplayName: Server
        CFBundleName: PortalWidget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hellupeptic.portal.widget
        CODE_SIGN_ENTITLEMENTS: PortalWidget/PortalWidget.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # The share menu's "Peptic's Workshop": photos, videos, files, links and
  # text into The Cache's From iPhone folder (PortalShare/ShareViewController).
  PortalShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PortalShare
        excludes:
          - Info.plist
          - PortalShare.entitlements
      - path: Shared
    info:
      path: PortalShare/Info.plist
      properties:
        CFBundleDisplayName: Peptic's Workshop
        CFBundleName: PortalShare
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hellupeptic.portal.share
        CODE_SIGN_ENTITLEMENTS: PortalShare/PortalShare.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # Draws the widgets as pictures on GitHub's iPhone simulator, to look at
  # them without a phone (.github/workflows/previews.yml). Not part of the app.
  WidgetPreviews:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PortalWidget
        excludes:
          - Info.plist
          - PortalWidget.entitlements
          - WidgetMain.swift
      - path: Shared
      - path: Previews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hellupeptic.portal.previews
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  WidgetPreviews:
    build:
      targets:
        WidgetPreviews: [test]
    test:
      targets:
        - WidgetPreviews
